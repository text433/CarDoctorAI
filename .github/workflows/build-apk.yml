name: Build CarDoctor AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "downloads/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Bootstrap Gradle 8.7 only if wrapper JAR is missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate and commit full Gradle wrapper once
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Commit complete Gradle wrapper [skip ci]"
            git push
          fi

      - name: Ensure wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" CarDoctorAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDoctorAI-APK
          path: CarDoctorAI.apk
          if-no-files-found: error
