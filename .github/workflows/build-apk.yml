name: Build CarDoctor AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "downloads/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bootstrap Gradle wrapper jar
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build with project Gradle wrapper
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" CarDoctorAI.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDoctorAI-APK
          path: CarDoctorAI.apk
          if-no-files-found: error
