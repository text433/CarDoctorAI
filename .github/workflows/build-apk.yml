name: Build CarDoctor AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "downloads/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build standard debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Deep APK validation
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "=== BADGING ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          echo "=== MANIFEST ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml
          echo "=== SIGNATURE ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" APK-Install-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Install-Test
          path: APK-Install-Test.apk
          if-no-files-found: error

      - name: Publish direct APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp APK-Install-Test.apk downloads/APK-Install-Test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/APK-Install-Test.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish deeply validated APK install test [skip ci]"
            git push
          fi
