name: Build CarDoctor AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "downloads/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Prepare and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CarDoctorAI.apk
          test -s CarDoctorAI.apk
          unzip -t CarDoctorAI.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CarDoctorAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDoctorAI-APK
          path: CarDoctorAI.apk
          if-no-files-found: error

      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp CarDoctorAI.apk downloads/CarDoctorAI-v0.1.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/CarDoctorAI-v0.1.1.apk
          if git diff --cached --quiet; then
            echo "Direct-download APK is already current."
          else
            git commit -m "Publish verified installable APK [skip ci]"
            git push
          fi
