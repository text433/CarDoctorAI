<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#080b08" />
<title>PixelMMO</title>
<style>
:root{--gold:#b9904d;--gold2:#6f5128;--ink:#080b08;--panel:#111812}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 45%,#263522 0,#10170f 58%,#050705 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.015) 50%,rgba(0,0,0,.025) 50%);background-size:100% 4px;z-index:1}
#frame{position:fixed;inset:0;pointer-events:none;z-index:2;border:3px solid #251b0e;box-shadow:inset 0 0 0 2px var(--gold2),inset 0 0 45px #000b}
#brand{position:fixed;top:7px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;font:700 13px Georgia,serif;letter-spacing:4px;color:#d7b66e;text-shadow:0 2px #000,0 0 8px #9d702f88;opacity:.85}
#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;font:9px monospace;color:#a88d59;background:#080b08aa;border:1px solid #4c3a20;padding:3px 8px;border-radius:10px}
canvas{position:fixed!important;inset:0;display:block;margin:auto;image-rendering:pixelated;touch-action:none;z-index:5;filter:contrast(1.04) saturate(.92);box-shadow:0 0 60px #0008}
@media(max-width:700px){#brand{font-size:10px;top:3px}#hint{display:none}#frame{border-width:2px}}
</style>
</head>
<body>
<div id="frame"></div><div id="brand">PIXELMMO</div><div id="hint">DARK FANTASY • AUTO COMBAT • LOOT • SKILLS</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="game.js?v=20260826-ui2"></script>
<script src="ui-theme.js?v=20260826-ui2"></script>
</body>
</html>
